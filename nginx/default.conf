map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream nuvik_vet_web {
  server nuvik-vet-web:5178;
}

upstream nuvik_vet_api {
  server nuvik-vet-api:4108;
}

server {
  listen 80;
  server_name localhost;

  client_max_body_size 50m;
  client_body_timeout 60s;

  include /etc/nginx/conf.d/nuvik-vet-routes.inc;
}
